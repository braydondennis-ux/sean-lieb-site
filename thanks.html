<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Sean Lieb | LevRose Commercial Real Estate</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800&family=Fira+Sans+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b3843;--navy:#324659;--navy-d:#26333f;--body:#5c6369;--muted:#949aa1;--line:#e5e7e9;--orange:#ea4100;--steel:#7aabd9;--disp:'Fira Sans',sans-serif;--cond:'Fira Sans Condensed',sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-family:var(--cond);text-align:center;padding:40px}
  .card{max-width:560px}
  .ring{width:78px;height:78px;border:2px solid var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-size:34px;color:var(--orange)}
  .eyebrow{font-family:var(--cond);font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}
  h1{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(34px,6vw,56px);color:#fff;line-height:1.05;margin:16px 0 14px}
  p{color:rgba(255,255,255,.82);font-size:18px;max-width:440px;margin:0 auto 30px}
  .btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;padding:15px 30px;background:var(--orange);color:#fff}
  .btn:hover{background:#c93800}
  .sub{margin-top:22px;font-size:14px;color:rgba(255,255,255,.6)}
  .sub a{color:#fff}.sub a:hover{color:var(--orange)}
</style>
</head>
<body>
  <div class="card">
    <div class="ring">✓</div>
    <span class="eyebrow">Message Sent</span>
    <h1>Thank You</h1>
    <p>Thanks for reaching out — your message is on its way to Sean. He'll get back to you shortly.</p>
    <a class="btn" href="index.html">Back to home</a>
    <div class="sub">Need to talk sooner? Call <a href="tel:+16024919295">602.491.9295</a></div>
  </div>
</body>
</html>
